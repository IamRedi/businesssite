<!doctype html><html><head><meta charset="utf-8"><title>locate</title></head><body>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const name = params.get("name");
  const draw = async (side) => {
    const response = await fetch(`/e/${side}/${name}.png`, { cache: "no-store" });
    const bmp = await createImageBitmap(await response.blob());
    const canvas = new OffscreenCanvas(bmp.width, bmp.height);
    const ctx = canvas.getContext("2d");
    ctx.drawImage(bmp, 0, 0);
    return { data: ctx.getImageData(0, 0, bmp.width, bmp.height).data, w: bmp.width, h: bmp.height };
  };
  const a = await draw("before");
  const b = await draw("after");
  let minX = 1e9, maxX = -1, minY = 1e9, maxY = -1, count = 0;
  const rowHistogram = {};
  for (let y = 0; y < a.h; y++) {
    for (let x = 0; x < a.w; x++) {
      const i = (y * a.w + x) * 4;
      const d = Math.max(Math.abs(a.data[i] - b.data[i]), Math.abs(a.data[i + 1] - b.data[i + 1]), Math.abs(a.data[i + 2] - b.data[i + 2]));
      if (d > 2) {
        count++;
        minX = Math.min(minX, x); maxX = Math.max(maxX, x);
        minY = Math.min(minY, y); maxY = Math.max(maxY, y);
        const band = Math.floor(y / 100) * 100;
        rowHistogram[band] = (rowHistogram[band] ?? 0) + 1;
      }
    }
  }
  window.__locate = { name, count, box: { minX, maxX, minY, maxY }, rowHistogram };
  if (count > 0 && new URLSearchParams(location.search).get("overlay") === "1") {
    const [cx, cy, cw, ch] = ["x", "y", "w", "h"].map((k) => Number(params.get(k)));
    const canvas = document.createElement("canvas");
    canvas.width = cw; canvas.height = ch;
    const ctx = canvas.getContext("2d");
    const img = ctx.createImageData(cw, ch);
    for (let y = 0; y < ch; y++) {
      for (let x = 0; x < cw; x++) {
        const px = cx + x, py = cy + y;
        const i = (py * a.w + px) * 4;
        const d = Math.max(Math.abs(a.data[i] - b.data[i]), Math.abs(a.data[i + 1] - b.data[i + 1]), Math.abs(a.data[i + 2] - b.data[i + 2]));
        const o = (y * cw + x) * 4;
        const base = b.data[i];
        img.data[o] = d > 2 ? 255 : base;
        img.data[o + 1] = d > 2 ? 0 : base;
        img.data[o + 2] = d > 2 ? 0 : base;
        img.data[o + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    document.body.appendChild(canvas);
  }
  window.__diffDone = true;
  document.title = "locate done";
})();
</script></body></html>
