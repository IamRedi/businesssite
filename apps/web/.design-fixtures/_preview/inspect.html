<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#333}canvas{display:block}</style></head><body>
<canvas id="c"></canvas>
<script>
const params = new URLSearchParams(location.search);
const src = params.get("src") ?? "/f/_preview/inspect.png";
const scale = Number(params.get("scale") ?? "0.3");
fetch(src).then(r => r.blob()).then(blob => createImageBitmap(blob)).then(bmp => {
  const c = document.getElementById("c");
  c.width = Math.round(bmp.width * scale);
  c.height = Math.round(bmp.height * scale);
  const ctx = c.getContext("2d");
  ctx.drawImage(bmp, 0, 0, c.width, c.height);
  document.title = "inspect:" + bmp.width + "x" + bmp.height;
});
</script></body></html>
